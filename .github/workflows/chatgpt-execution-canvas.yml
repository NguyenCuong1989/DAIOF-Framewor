name: ChatGPT Execution Canvas

on:
  pull_request:
    paths:
      - 'apps/chatgpt-execution-canvas/**'
      - '.github/workflows/chatgpt-execution-canvas.yml'
  push:
    branches:
      - codex/chatgpt-execution-canvas-production
    paths:
      - 'apps/chatgpt-execution-canvas/**'
      - '.github/workflows/chatgpt-execution-canvas.yml'

permissions:
  contents: read

concurrency:
  group: execution-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chatgpt-execution-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: MCP contract validation
        run: npm run validate:contract
      - name: Production build
        run: npm run build
