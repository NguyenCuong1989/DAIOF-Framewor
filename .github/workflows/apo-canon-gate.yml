name: APΩ Canon Gate

on:
  push:
    branches:
      - main
      - apo-canon-cicd
      - hyperai_purge
  pull_request:
    branches:
      - main

jobs:
  canon-gate:
    name: Build and run APΩ canonical gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang++-14 \
            nlohmann-json3-dev \
            python3 \
            python3-pip

      - name: Compile canonical gate
        run: |
          clang++-14 \
            -std=c++20 \
            -O2 \
            -Wall -Wextra -Wpedantic -Werror \
            .apo/canon/apo_load_state.cpp \
            -o .apo/bin/apo-canon-gate

      - name: Extract workspace state
        run: |
          python3 .apo/canon/extractor.py . .apo/state/workspace-state.json

      - name: Run canonical gate
        run: |
          set +e
          ./.apo/bin/apo-canon-gate .apo/state/workspace-state.json
          EXIT=$?
          echo "APO_GATE_EXIT=$EXIT"
          exit $EXIT
