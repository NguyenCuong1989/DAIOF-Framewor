name: 🔄 Real-Time Autonomous Task Generation

on:
  schedule:
    # One bounded run per five minutes; concurrency prevents overlapping runners.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      interval:
        description: 'Task generation interval (seconds)'
        required: false
        default: '10'
        type: string
      duration:
        description: 'Run duration (minutes, 0 = infinite)'
        required: false
        default: '5'
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: realtime-autonomous-tasks
  cancel-in-progress: true

jobs:
  realtime_tasks:
    runs-on: ubuntu-latest
    name: Continuous Task Generation & Execution
    timeout-minutes: 10
    
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install PyGithub pyyaml black isort pylint
      
      - name: 🔄 Run Real-Time Task Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTERVAL: ${{ github.event.inputs.interval || '10' }}
          DURATION: ${{ github.event.inputs.duration || '5' }}
        run: |
          echo "🧬 Starting Real-Time Autonomous Task Generator"
          echo "⏱️  Interval: ${INTERVAL}s | Duration: ${DURATION}min"
          
          # The generator is intentionally continuous; timeout is the bounded-run control.
          # Only the expected timeout status (124) is accepted. Other failures propagate.
          timeout "${DURATION}m" python3 .github/scripts/realtime_task_generator.py
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "❌ Task generator failed with exit code $status"
            exit "$status"
          fi

          LOG_FILE="logs/tasks_$(date -u +%Y%m%d).json"
          if [ ! -f "$LOG_FILE" ]; then
            echo "❌ Missing task execution log: $LOG_FILE"
            exit 1
          fi

          python3 - "$LOG_FILE" <<'PY'
import json
import sys
from pathlib import Path

path = Path(sys.argv[1])
data = json.loads(path.read_text())
failed = int(data.get("total_failed", 0))
completed = int(data.get("total_completed", 0))
generated = int(data.get("total_generated", 0))
print(f"📊 Generator receipt: generated={generated} completed={completed} failed={failed}")
if failed:
    print("❌ Task failures detected; refusing autonomous commit.")
    raise SystemExit(1)
PY

          echo "✅ Bounded task run completed with no recorded task failures."
      
      - name: 📊 Upload Task Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-logs-${{ github.run_id }}
          path: logs/*.json
          retention-days: 7
      
      - name: 💾 Commit Generated Changes
        if: success()
        run: |
          git config user.name "DAIOF Organism"
          git config user.email "organism@daiof-framework.dev"
          
          # Check for changes
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            
            # Count changed paths, not insertion/deletion counts.
            CHANGES=$(git diff --cached --name-only | wc -l | tr -d ' ')
            
            # Create commit message
            COMMIT_MSG="🤖 Real-time auto-updates: $TIMESTAMP - Generated and executed tasks autonomously - Changes: $CHANGES files - Task logs in logs/ directory [Autonomous Task Generator]"
            
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️  No changes to commit"
          fi
      
      - name: 📈 Report to Summary
        if: always()
        run: |
          echo "## 🔄 Real-Time Task Generation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "logs/tasks_$(date -u +%Y%m%d).json" ]; then
            echo "### 📊 Task Execution Receipt" >> $GITHUB_STEP_SUMMARY
            python3 - "logs/tasks_$(date -u +%Y%m%d).json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
import json
import sys
from pathlib import Path
d=json.loads(Path(sys.argv[1]).read_text())
print(f"- Generated: {d.get('total_generated', 0)}")
print(f"- Completed: {d.get('total_completed', 0)}")
print(f"- Failed: {d.get('total_failed', 0)}")
PY
            echo "📁 Task logs available in logs/ directory" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No task execution receipt found" >> $GITHUB_STEP_SUMMARY
          fi

